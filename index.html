<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI/ML Engineer &amp; Frontend Developer</title>
    <meta
      name="description"
      content="Personal portfolio of Auwal Salele Iro — AI/ML Engineer, Deep Learning Practitioner, and Frontend Developer building intelligent, data-driven solutions and modern web experiences."
    />
    <meta
      name="keywords"
      content="Auwal Salele Iro, AI Engineer, Machine Learning Engineer, Deep Learning, Computer Vision, Frontend Developer, React, TypeScript, Portfolio"
    />
    <meta name="author" content="Auwal Salele Iro" />
    <meta name="theme-color" content="#070B14" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI/ML Engineer &amp; Frontend Developer" />
    <meta
      property="og:description"
      content="Building intelligent solutions through AI, Machine Learning, Deep Learning, and modern frontend architecture."
    />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI/ML Engineer &amp; Frontend Developer" />
    <meta
      name="twitter:description"
      content="Building intelligent solutions through AI, Machine Learning, Deep Learning, and modern frontend architecture."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Custom Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent theme flicker; retains dark theme as default -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme = stored === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#070B14' : '#F8FAFC');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-[#070B14] dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
